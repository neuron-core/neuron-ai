name: Static Analysis

on:
  push:
    branches:
        - '*.x'
    paths:
      - '**.php'
      - 'phpstan.neon'
  pull_request:

permissions:
    contents: read

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mongodb-2.5.2
          coverage: none

      # The PHP 8.1 parser rejects newer syntax that PHPStan rules can miss, such as DNF types.
      - name: Lint PHP 8.1 syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -d display_errors=stderr -l > /dev/null

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
